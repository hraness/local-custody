[package]
name = "local-custody"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Owner-only path checks, stable private reads, and atomic private file writes for Rust CLIs."
repository = "https://github.com/hraness/local-custody"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "local-custody"
path = "src/main.rs"
