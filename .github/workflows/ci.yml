name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs share a ref-scoped group so a new push cancels the superseded run;
# main pushes get a per-SHA group so a later merge never cancels them.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # No workflow-level RUSTFLAGS: scripts/build-rust-artifacts.ts appends to
  # RUSTFLAGS for the deterministic sidecar build. Clippy passes -D warnings.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The cargo workspace lives at the repository root (rust/ is a
          # member); target output and Cargo.lock resolve there.
          workspaces: .
          # PR runs restore main's cache but never write their own entry.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      # Clippy (a superset of cargo check) for the Windows target runs here on
      # Linux, once; the Windows job only runs the native tests.
      - run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js"].map((path) => import(path)))'

  windows:
    name: Windows native custody
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-targets --locked

  required:
    name: Required
    if: always()
    needs: [check, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking job
        env:
          CHECK: ${{ needs.check.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          [[ "$CHECK" == success ]]
          [[ "$WINDOWS" == success ]]
