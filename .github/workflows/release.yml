name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - name: Verify release identity and governed main ancestry
        id: identity
        run: python3 -I scripts/release-artifacts.py qualify
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Require the checked distribution to match source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- dist bun.lock)"
      - name: Exercise source and artifact boundary regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  rust_artifacts:
    name: Build sidecar (${{ matrix.pair }}) without signing credentials
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Matrix legs publish distinct keys, preserving successful outputs when
    # only another leg or a downstream consumer is retried.
    outputs:
      linux_x64_artifact_id: ${{ steps.producer.outputs.linux_x64_artifact_id }}
      linux_x64_artifact_digest: ${{ steps.producer.outputs.linux_x64_artifact_digest }}
      darwin_arm64_artifact_id: ${{ steps.producer.outputs.darwin_arm64_artifact_id }}
      darwin_arm64_artifact_digest: ${{ steps.producer.outputs.darwin_arm64_artifact_digest }}
      darwin_x64_artifact_id: ${{ steps.producer.outputs.darwin_x64_artifact_id }}
      darwin_x64_artifact_digest: ${{ steps.producer.outputs.darwin_x64_artifact_digest }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pair: linux-x64
            triple: x86_64-unknown-linux-gnu
          - os: macos-14
            pair: darwin-arm64
            triple: aarch64-apple-darwin
          - os: macos-14
            pair: darwin-x64
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.triple }}
      - name: Build exact locked native source
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo/registry/src/=/cargo-registry-src/ --remap-path-prefix=$HOME/.rustup/toolchains/=/rust-toolchains/ -C strip=symbols"
          cargo build --release --locked --target "$TARGET" -p local-custody
      - id: native
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-custody-${{ matrix.pair }}-${{ github.run_attempt }}
          path: target/${{ matrix.triple }}/release/local-custody
          if-no-files-found: error
          retention-days: 7
      - name: Preserve this native producer's immutable artifact identity
        id: producer
        env:
          PAIR: ${{ matrix.pair }}
          ARTIFACT_ID: ${{ steps.native.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.native.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$PAIR" in linux-x64|darwin-arm64|darwin-x64) ;; *) exit 1 ;; esac
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          key="${PAIR//-/_}"
          printf '%s_artifact_id=%s\n%s_artifact_digest=%s\n' "$key" "$ARTIFACT_ID" "$key" "$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

  prepare_unsigned:
    name: Bind both unsigned Mac architecture inputs
    needs: [verify, rust_artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - name: Collect exact same-run native artifacts without executing them
        env:
          GH_TOKEN: ${{ github.token }}
          DARWIN_ARM64_ARTIFACT_ID: ${{ needs.rust_artifacts.outputs.darwin_arm64_artifact_id }}
          DARWIN_ARM64_ARTIFACT_DIGEST: ${{ needs.rust_artifacts.outputs.darwin_arm64_artifact_digest }}
          DARWIN_X64_ARTIFACT_ID: ${{ needs.rust_artifacts.outputs.darwin_x64_artifact_id }}
          DARWIN_X64_ARTIFACT_DIGEST: ${{ needs.rust_artifacts.outputs.darwin_x64_artifact_digest }}
        run: python3 -I scripts/release-artifacts.py prepare-unsigned unsigned-artifacts
      - id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-unsigned-${{ github.run_attempt }}
          path: unsigned-artifacts/
          if-no-files-found: error
          retention-days: 7

  macos_sign:
    name: Isolated Developer ID signing and notarization
    needs: [verify, prepare_unsigned]
    environment: hraness-apple-release
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
      artifact_digest: ${{ steps.signed.outputs.artifact-digest }}
      archive_sha256: ${{ steps.bytes.outputs.archive_sha256 }}
      arm64_sha256: ${{ steps.bytes.outputs.arm64_sha256 }}
      x64_sha256: ${{ steps.bytes.outputs.x64_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - name: Download exact unsigned artifact job output
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_ARTIFACT_ID: ${{ needs.prepare_unsigned.outputs.artifact_id }}
          UNSIGNED_ARTIFACT_DIGEST: ${{ needs.prepare_unsigned.outputs.artifact_digest }}
        run: python3 -I scripts/release-artifacts.py fetch-unsigned "$RUNNER_TEMP/unsigned-sidecars"
      - name: Sign and notarize without payload execution
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 -I scripts/sign-macos-sidecars.py sign "$RUNNER_TEMP/unsigned-sidecars/local-custody-$VERSION-darwin-sidecars.unsigned.tar.gz" "$VERSION" signed-artifacts "$RUNNER_TEMP/local-custody-apple-signing"
      - name: Remove isolated credentials on every outcome
        if: always()
        run: python3 -I scripts/sign-macos-sidecars.py cleanup "$RUNNER_TEMP/local-custody-apple-signing"
      - name: Record exact signed payload hashes after cleanup
        id: bytes
        run: python3 -I scripts/release-artifacts.py record-signed signed-artifacts
      - id: signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-signed-${{ github.run_attempt }}
          path: signed-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve non-secret notarization UUID and hashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notarization-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-custody-apple-notarization.json
          if-no-files-found: ignore
          retention-days: 30

  assemble:
    name: Assemble one npm package from exact signed bytes
    needs: [verify, rust_artifacts, macos_sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
      artifact_digest: ${{ steps.package.outputs.artifact-digest }}
      tarball_sha256: ${{ steps.bytes.outputs.tarball_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Stage exact signed Mac and same-run Linux sidecars
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_X64_ARTIFACT_ID: ${{ needs.rust_artifacts.outputs.linux_x64_artifact_id }}
          LINUX_X64_ARTIFACT_DIGEST: ${{ needs.rust_artifacts.outputs.linux_x64_artifact_digest }}
          SIGNED_ARTIFACT_ID: ${{ needs.macos_sign.outputs.artifact_id }}
          SIGNED_ARTIFACT_DIGEST: ${{ needs.macos_sign.outputs.artifact_digest }}
          SIGNED_ARM64_SHA256: ${{ needs.macos_sign.outputs.arm64_sha256 }}
          SIGNED_X64_SHA256: ${{ needs.macos_sign.outputs.x64_sha256 }}
        run: python3 -I scripts/release-artifacts.py stage dist/rust-artifacts/local-custody
      - name: Generate manifest from final signed bytes
        run: bun run rust:build:manifest
      - name: Pack once without executing package or native payloads
        run: |
          set -euo pipefail
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts .
      - name: Verify packaged sidecars and record immutable tarball checksum
        id: bytes
        env:
          SIGNED_ARM64_SHA256: ${{ needs.macos_sign.outputs.arm64_sha256 }}
          SIGNED_X64_SHA256: ${{ needs.macos_sign.outputs.x64_sha256 }}
        run: python3 -I scripts/release-artifacts.py record-package artifacts
      - id: package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  package_smoke:
    name: Exact npm package on native ${{ matrix.arch }} macOS
    needs: [assemble, macos_sign]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Download and verify the immutable assembled package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact_digest }}
          PACKAGE_SHA256: ${{ needs.assemble.outputs.tarball_sha256 }}
          SIGNED_ARM64_SHA256: ${{ needs.macos_sign.outputs.arm64_sha256 }}
          SIGNED_X64_SHA256: ${{ needs.macos_sign.outputs.x64_sha256 }}
        run: python3 -I scripts/release-artifacts.py fetch-package artifacts
      - name: Exercise the exact packed native sidecar without fallback
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun -e 'if (process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
          bun run scripts/package-smoke.ts --archive artifacts/*.tgz --require-rust

  publish:
    name: Publish immutable GitHub release
    needs: [verify, assemble, macos_sign, package_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - name: Download the same package admitted by both Mac smoke jobs
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact_digest }}
          PACKAGE_SHA256: ${{ needs.assemble.outputs.tarball_sha256 }}
          SIGNED_ARM64_SHA256: ${{ needs.macos_sign.outputs.arm64_sha256 }}
          SIGNED_X64_SHA256: ${{ needs.macos_sign.outputs.x64_sha256 }}
        run: python3 -I scripts/release-artifacts.py fetch-package artifacts
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          python3 -I scripts/release-artifacts.py verify-tag
          artifacts=(artifacts/*.tgz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm release tarball"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            published_tags="$(gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
            printf '%s\n' "$published_tags" | NEXT_TAG="$GITHUB_REF_NAME" node -e '
              const fs = require("node:fs");
              const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
              const parse = (tag) => {
                const match = pattern.exec(tag);
                return match === null ? null : match.slice(1).map(BigInt);
              };
              const compare = (left, right) => {
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] !== right[index]) {
                    return left[index] > right[index] ? 1 : -1;
                  }
                }
                return 0;
              };
              const next = parse(process.env.NEXT_TAG ?? "");
              if (next === null) process.exit(1);
              for (const tag of fs.readFileSync(0, "utf8").split(/\r?\n/u)) {
                const current = parse(tag);
                if (current !== null && compare(next, current) <= 0) {
                  console.error("::error::Release " + process.env.NEXT_TAG + " is not newer than " + tag);
                  process.exit(1);
                }
              }
            '
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Local Custody $GITHUB_REF_NAME" \
              "${artifacts[0]}" artifacts/SHA256SUMS
          fi
          # An immutable pre-existing release must contain these same bytes.
          # A notarization rerun is not permission to mirror a different tarball.
          published="$RUNNER_TEMP/published-local-custody"
          mkdir "$published"
          gh release download "$GITHUB_REF_NAME" --dir "$published" \
            --pattern "$(basename "${artifacts[0]}")" --pattern SHA256SUMS
          cmp "${artifacts[0]}" "$published/$(basename "${artifacts[0]}")"
          cmp artifacts/SHA256SUMS "$published/SHA256SUMS"
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          expected_state="$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t2'
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is not published and immutable"
            exit 1
          fi
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Latest release is $latest_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi

  npm_mirror:
    name: Mirror the identical tarball to npm
    needs: [verify, assemble, macos_sign, publish]
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Download the exact GitHub-release package; never repack
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.assemble.outputs.artifact_digest }}
          PACKAGE_SHA256: ${{ needs.assemble.outputs.tarball_sha256 }}
          SIGNED_ARM64_SHA256: ${{ needs.macos_sign.outputs.arm64_sha256 }}
          SIGNED_X64_SHA256: ${{ needs.macos_sign.outputs.x64_sha256 }}
        run: python3 -I scripts/release-artifacts.py fetch-package artifacts
      - name: Publish identical npm bytes through trusted publishing
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python3 -I scripts/release-artifacts.py verify-tag
          tarball="artifacts/hraness-local-custody-$VERSION.tgz"
          expected="$(node -e 'const fs=require("node:fs"),c=require("node:crypto"); process.stdout.write("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")"
          if published="$(npm view "@hraness/local-custody@$VERSION" dist.integrity --fetch-timeout=30000 --fetch-retries=0 2>/dev/null)"; then
            test "$published" = "$expected"
          else
            npm publish "$tarball" --ignore-scripts --provenance --access public
          fi
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            if published="$(npm view "@hraness/local-custody@$VERSION" dist.integrity --fetch-timeout=30000 --fetch-retries=0 2>/dev/null)"; then
              test "$published" = "$expected"
              echo "npm serves the exact tested tarball for $VERSION"
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::npm did not serve the exact package within 600s"
              exit 1
            fi
            sleep 15
          done
