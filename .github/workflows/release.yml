name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  rust_artifacts:
    name: Build native sidecar (${{ matrix.platform }}-${{ matrix.arch }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            triple: x86_64-unknown-linux-gnu
          - os: macos-14
            platform: darwin
            arch: arm64
            triple: aarch64-apple-darwin
          - os: macos-14
            platform: darwin
            arch: x64
            triple: x86_64-apple-darwin
    steps:
      - name: Check out exact tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}
      - name: Build local-custody sidecar
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=${HOME}/.cargo/registry/src/=/cargo-registry-src/ --remap-path-prefix=${HOME}/.rustup/toolchains/=/rust-toolchains/ -C strip=symbols"
        run: |
          set -euo pipefail
          cd rust
          cargo build --release --target ${{ matrix.triple }} -p local-custody
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-custody-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.triple }}/release/local-custody
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify
    needs: rust_artifacts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verified_tag: ${{ steps.identity.outputs.tag }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $expected_tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not newer than $newest_stable_tag"
            exit 1
          fi
          printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Download native sidecar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: local-custody-*
          path: dist/rust-artifacts/sidecar-temp/
          merge-multiple: false
      - name: Stage native sidecar artifacts in the npm tree
        run: |
          set -euo pipefail
          for pair in linux-x64 darwin-arm64 darwin-x64; do
            src="dist/rust-artifacts/sidecar-temp/local-custody-${pair}/local-custody"
            dest="dist/rust-artifacts/local-custody/${pair}/local-custody"
            if [[ ! -f "$src" ]]; then
              echo "::error::Missing native sidecar artifact for ${pair}"
              exit 1
            fi
            mkdir -p "dist/rust-artifacts/local-custody/${pair}"
            cp "$src" "$dest"
            chmod +x "$dest"
          done
          rm -rf dist/rust-artifacts/sidecar-temp/
      - name: Regenerate the rust artifact manifest for every staged target
        run: bun run rust:build:manifest
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js"].map((path) => import(path)))'
      - name: Create one exact npm tarball and checksum
        run: |
          set -euo pipefail
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts .
          artifacts=(artifacts/*.tgz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm release tarball"
            exit 1
          fi
          (cd artifacts && sha256sum "$(basename "${artifacts[0]}")" > SHA256SUMS)
      - name: Preserve exact release bytes
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - name: Download exact release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: artifacts
          merge-multiple: true
      - name: Recheck exact checksum
        run: (cd artifacts && sha256sum --check SHA256SUMS)
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ -z "$VERIFIED_TAG" || "$VERIFIED_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Publish request does not match the verified tag"
            exit 1
          fi
          artifacts=(artifacts/*.tgz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm release tarball"
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            published_tags="$(gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
            printf '%s\n' "$published_tags" | NEXT_TAG="$GITHUB_REF_NAME" node -e '
              const fs = require("node:fs");
              const pattern = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
              const parse = (tag) => {
                const match = pattern.exec(tag);
                return match === null ? null : match.slice(1).map(BigInt);
              };
              const compare = (left, right) => {
                for (let index = 0; index < 3; index += 1) {
                  if (left[index] !== right[index]) {
                    return left[index] > right[index] ? 1 : -1;
                  }
                }
                return 0;
              };
              const next = parse(process.env.NEXT_TAG ?? "");
              if (next === null) process.exit(1);
              for (const tag of fs.readFileSync(0, "utf8").split(/\r?\n/u)) {
                const current = parse(tag);
                if (current !== null && compare(next, current) <= 0) {
                  console.error("::error::Release " + process.env.NEXT_TAG + " is not newer than " + tag);
                  process.exit(1);
                }
              }
            '
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "Local Custody $GITHUB_REF_NAME" \
              "${artifacts[0]}" artifacts/SHA256SUMS
          fi
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --json assets,isDraft,isImmutable,isPrerelease,tagName \
            --jq '[.tagName, .isDraft, .isPrerelease, .isImmutable, (.assets | length)] | @tsv')"
          expected_state="$GITHUB_REF_NAME"$'\tfalse\tfalse\ttrue\t2'
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::Release $GITHUB_REF_NAME is not published and immutable"
            exit 1
          fi
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          if [[ "$latest_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Latest release is $latest_tag, expected $GITHUB_REF_NAME"
            exit 1
          fi

  npm_mirror:
    name: Mirror exact version to npm
    needs: [verify, publish]
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install npm trusted-publishing client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Download native sidecar artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: local-custody-*
          path: dist/rust-artifacts/sidecar-temp/
          merge-multiple: false
      - name: Stage native sidecar artifacts in the npm tree
        run: |
          set -euo pipefail
          for pair in linux-x64 darwin-arm64 darwin-x64; do
            src="dist/rust-artifacts/sidecar-temp/local-custody-${pair}/local-custody"
            dest="dist/rust-artifacts/local-custody/${pair}/local-custody"
            if [[ ! -f "$src" ]]; then
              echo "::error::Missing native sidecar artifact for ${pair}"
              exit 1
            fi
            mkdir -p "dist/rust-artifacts/local-custody/${pair}"
            cp "$src" "$dest"
            chmod +x "$dest"
          done
          rm -rf dist/rust-artifacts/sidecar-temp/
      - name: Regenerate the rust artifact manifest for every staged target
        run: bun run rust:build:manifest
      - name: Pack the verified version
        id: pack
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ "v$package_version" != "$VERIFIED_TAG" ]]; then
            echo "::error::Package version $package_version does not match $VERIFIED_TAG"
            exit 1
          fi
          tarball="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" . | tail -n 1)"
          expected="hraness-local-custody-$package_version.tgz"
          if [[ "$tarball" != "$expected" ]]; then
            echo "::error::Packed $tarball, expected $expected"
            exit 1
          fi
          printf 'tarball=%s\nversion=%s\n' "$RUNNER_TEMP/$tarball" "$package_version" >> "$GITHUB_OUTPUT"
      - name: Publish to npm through trusted publishing
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@hraness/local-custody@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "npm already serves $VERSION; publication is idempotent"
            exit 0
          fi
          npm publish "$TARBALL" --provenance --access public
      - name: Verify exact npm publication
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))
          while true; do
            if published="$(npm view "@hraness/local-custody@$VERSION" version 2>/dev/null)" && [[ "$published" == "$VERSION" ]]; then
              echo "npm serves $published"
              break
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::npm did not serve $VERSION within 900s of publication"
              exit 1
            fi
            sleep 15
          done
